name: Cleanup Temporary DEM Artifacts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry run or actually delete completed test artifacts'
        required: true
        type: choice
        default: delete
        options:
          - delete
          - dry-run
      minimum_age_hours:
        description: 'Only delete artifacts older than this many hours'
        required: true
        default: '0'
        type: string
  schedule:
    - cron: '33 3 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-dem-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install 'requests>=2.32,<3'
      - name: Remove completed temporary test artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event_name == 'schedule' && 'delete' || inputs.mode }}
          AGE_HOURS: ${{ github.event_name == 'schedule' && '24' || inputs.minimum_age_hours }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --minimum-age-hours "$AGE_HOURS")
          if [ "$MODE" = "delete" ]; then args+=(--delete); fi
          python scripts/cleanup_artifacts.py "${args[@]}"
