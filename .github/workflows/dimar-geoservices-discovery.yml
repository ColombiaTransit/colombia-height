name: Discover Official DIMAR Coastal Geoservices

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dimar-geoservices-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing research dependencies
        run: python -m pip install -r requirements-terrain.txt -r requirements-island-inventory.txt
      - name: Run all offline regression tests, including coast/sea semantics
        run: python -m unittest discover -s tests -v
      - name: Inspect DIMAR direct ArcGIS REST service registry and coastal layer metadata
        run: |
          python scripts/dimar_geoservice_discovery.py \
            --candidate-registry data/official-igac-source-review-2026-11-13.json \
            --max-services 200 --max-layers 110 \
            --output output/dimar-catalog/dimar-catalog-report.json
      - name: Enforce no automatic coastline approval or COG promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/dimar-catalog/dimar-catalog-report.json").read_text())
          assert r["cog_source_candidates_referenced"]==52
          assert r["production_source_count_unchanged"]==137
          assert r["quitasueno_excluded"] is True
          assert r["official_land_polygon_certified"] is False
          assert r["national_publication_allowed"] is False
          assert all(layer["land_mask_status"]=="NOT_VALIDATED" for layer in
                     r["coastline_or_island_metadata_candidates"])
          assert all(layer["no_geometry_downloaded"] for layer in
                     r["coastline_or_island_metadata_candidates"])
          print("Direct DIMAR service catalog reachable:",r["direct_official_service_catalog_reachable"])
          print("Coastline/island layer candidates:",r["candidate_coastal_layers"])
          print("Classification counts:",r["layer_type_counts"])
          print("No coast/ocean polygon authorized and no source added")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: colombia-dimar-geoservices-discovery
          path: output/dimar-catalog/dimar-catalog-report.json
          retention-days: 1
          if-no-files-found: error
