name: Investigate Gorgona Coarse Seam in Native 30m COG Source Rows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gorgona-native-border-review.yml'
      - 'scripts/island_native_source_border_review.py'
      - 'tests/test_island_native_source_border_review.py'

permissions:
  contents: read

jobs:
  raw-native-border:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install original native DEM analysis dependencies
        run: python -m pip install -r requirements-terrain.txt -r requirements-island-inventory.txt
      - name: Validate all offline tests including exact 5-pixel Gorgona seam logic
        run: python -m unittest discover -s tests -v
      - name: Rebuild 137 original selected native source catalog
        run: |
          python scripts/inventory.py --output output --workers 8
          python scripts/extend_inventory.py --inventory output --islands data/colombia-island-probes.json
          python - <<'PY'
          import csv
          with open('output/colombia_dem_manifest_extended.csv',newline='') as f:
              r=list(csv.DictReader(f))
          assert len(r)==137 and all(x['status']=='ok' for x in r)
          print('Original selected sources still 137')
          PY
      - name: Inspect exact flagged z11 Gorgona pixels against true 30m rows on both sides of 3 N; also check Malpelo at 4 N
        run: |
          python scripts/island_native_source_border_review.py \
            --manifest output/colombia_dem_manifest_extended.csv \
            --output output/native-island-source-border/island-native-source-border.json
      - name: Reconcile Gorgona flagged pixel pair count and native 30m diagnostics without source promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/native-island-source-border/island-native-source-border.json').read_text())
          assert r['original_selected_source_count']==137
          assert set(r['islands'])=={'gorgona','malpelo'}
          assert r['copernicus_source_manifest_unchanged'] is True
          assert r['quitasueno_excluded'] is True
          assert r['no_synthetic_ocean_or_height_fill'] is True
          assert r['national_publication_allowed'] is False
          g=r['islands']['gorgona']['original_z11_coarse_flag_analysis']
          assert g['zxy']==[11,579,1006]
          assert g['count_flags_over_40m']==5
          assert len(g['flags_over_40m'])==5
          for site,item in r['islands'].items():
              n=item['native_source_boundary']
              assert n['native_strips_sampled_350_longitudes_each_side']
              assert n['native_pixel_step_latitude_degrees']>0
              print(site,'native 30m border sample count:',n['native_cross_border']['count'],
                    'native border maximum:',n['native_cross_border']['maximum_m'],
                    'source-edge disproportionate gradient flags:',n['border_gt_40m_and_gt_3x_immediate_local_gradient'])
          print('All five Gorgona coarse flags retained for explanation, not suppressed')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: colombia-gorgona-five-coarse-seam-pairs-and-native-thirty-meter-edge
          path: output/native-island-source-border/island-native-source-border.json
          retention-days: 1
          if-no-files-found: error
