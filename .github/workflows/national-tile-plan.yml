name: National DEM Tile Plan (Dry Run)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of deterministic candidate output shards'
        type: choice
        options: ['16', '32', '64']
        required: true
        default: '32'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install inventory and Web Mercator tools
        run: python -m pip install -r requirements-terrain.txt -r requirements-island-inventory.txt
      - name: Regression tests (including unique tile ownership)
        run: python -m unittest discover -s tests -v
      - name: Original Copernicus Colombia inventory
        run: python scripts/inventory.py --output output --workers 8
      - name: Extend with offshore locations and small-island check
        run: python scripts/extend_inventory.py --inventory output --islands data/colombia-island-probes.json
      - name: Reconcile eight Natural Earth small-island samples
        run: python scripts/reconcile_minor_islands.py --manifest output/colombia_dem_manifest_extended.csv --review data/minor-island-review.json --output output/minor-island-reconciliation.json
      - name: Build deterministic tile ownership plan, no rasters downloaded
        run: python scripts/national_tile_plan.py --manifest output/colombia_dem_manifest_extended.csv --output output/national-plan --minzoom 0 --maxzoom 13 --shards ${{ inputs.shards }}
      - name: Verify candidate shard counts and uniqueness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/national-plan/national-tile-plan.json").read_text())
          count=sum(1 for f in Path("output/national-plan").glob("candidate-shard-*.ndjson") for _ in f.open())
          assert count==r["candidate_tile_count"],(count,r["candidate_tile_count"])
          assert sum(r["tiles_by_shard"].values())==count
          assert r["all_candidates_have_one_owner"] is True
          island=json.loads(Path("output/minor-island-reconciliation.json").read_text())
          assert island["already_covered_count"]==8
          print("Unique candidate assignments:",count)
          print("No extra sources for eight reviewed samples.")
          PY
      - name: Upload compact reports only (not temporary candidate lists)
        uses: actions/upload-artifact@v4
        with:
          name: colombia-national-tile-plan-dry-run
          path: |
            output/national-plan/national-tile-plan.json
            output/minor-island-reconciliation.json
            output/colombia_dem_manifest_extended.csv
          retention-days: 1
          if-no-files-found: error
