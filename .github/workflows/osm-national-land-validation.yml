name: OSM National Land Coverage Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/osm-national-land-validation.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native DEM and OSM polygon dependencies
        run: |
          python -m pip install -r requirements-terrain.txt -r requirements-island-inventory.txt
          python -m pip install 'fiona>=1.10,<2' 'pyproj>=3.6,<4'
      - name: Run all offline tests including pixel alignment and no fabricated ocean
        run: python -m unittest discover -s tests -v
      - name: Rebuild verified 137-COG inventory
        run: |
          python scripts/inventory.py --output output --workers 8
          python scripts/extend_inventory.py --inventory output --islands data/colombia-island-probes.json
          python - <<'PY'
          import csv
          with open('output/colombia_dem_manifest_extended.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==137 and all(x['status']=='ok' for x in rows)
          print("Selected Copernicus DEM source count is still 137")
          PY
      - name: Download official OSM coastline-derived global land polygons and run four-site native DEM audit
        run: |
          python scripts/osm_land_validation.py --download \
            --manifest output/colombia_dem_manifest_extended.csv \
            --archive output/osm/land-polygons-split-4326.zip \
            --output output/osm/osm-land-pilot.json
      - name: Reconcile exact four-site pilot and block publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/osm/osm-land-pilot.json").read_text())
          assert r['selected_native_cogs_unchanged']==137
          assert r['tiles_checked']==36
          assert set(r['pilot_sites'])=={'tumaco','san_andres','providencia','malpelo'}
          assert all(v['tiles']==9 for v in r['pilot_sites'].values())
          assert r['osm_land_is_not_colombia_territory']
          assert r['unknown_offshore_pixels_not_assumed_ocean']
          assert r['quitasueno_excluded_from_colombia_scope']
          assert r['no_height_values_fabricated']
          assert not r['national_publication_allowed']
          assert sum(r['missing_pixel_categories'].values())==sum(
              row['missing_native_dem_pixels'] for row in r['tiles'])
          print("OSM pilot sites:",json.dumps(r['pilot_sites'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: colombia-osm-land-coverage-pilot
          path: output/osm/osm-land-pilot.json
          retention-days: 1
          if-no-files-found: error
