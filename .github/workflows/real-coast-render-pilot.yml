name: Real Cartagena OSM Mixed-Coast Terrain-RGB — Visual Sea Surface Pilot

on:
  push:
    paths: ['.github/workflows/real-coast-render-pilot.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  coastal:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Existing generator + new coast encoder regression (offline)
        run: |
          python -m pip install -r requirements-terrain.txt -r requirements-island-inventory.txt
          python -m unittest discover -s tests -p test_render_only_coast_rgb.py -v
          python -m unittest discover -s tests -p test_generate_osm_land_only_terrain.py -v
      - name: Reuse 2026-11-14 physical OSM polygons and 140-source manifest
        uses: actions/download-artifact@v4
        with:
          repository: ColombiaTransit/colombia-height
          run-id: 43624636935
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: colombia-osm-terrain-pilot-inputs
          path: output
      - name: Confirm a genuine Cartagena mixed coast, no foreign land or new source scan
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from generate_osm_land_only_terrain import (
              load_osm_coastline_land,load_osm_country,prepare_plan,plan_bounded_tiles,
              require_verified_staging)
          from national_tile_plan import parse_manifest
          sources=parse_manifest("output/stage140/colombia_dem_manifest_tumaco_staging_140.csv")
          require_verified_staging(sources)
          land,meta=load_osm_coastline_land(
              "output/osm-reference/osm-land-study.wkb.gz",
              "output/osm-reference/osm-land-study-metadata.json")
          country=load_osm_country("output/osm-country/colombia-relation-120027.json")
          bbox=(-75.57,10.35,-75.45,10.51)
          tiles=plan_bounded_tiles(bbox,11,13,200)
          counts,rows=prepare_plan(tiles,land,country,include_physical=True)
          print("Original reviewed sources:",len(sources),"coastal tiles:",len(tiles),dict(counts))
          assert counts["mixed_coastal_OSM_Colombia_land_and_offland"]>0
          assert counts["fully_OSM_Colombia_land"]>0
          assert not counts["mixed_foreign_physical_OSM_land_blocked"]
          PY
      - name: Genuine source RGB plus visual-only 0m sea; factual OSM mask retained
        run: |
          python scripts/generate_osm_land_only_terrain.py \
            --source-manifest output/stage140/colombia_dem_manifest_tumaco_staging_140.csv \
            --osm-land-clip output/osm-reference/osm-land-study.wkb.gz \
            --osm-land-meta output/osm-reference/osm-land-study-metadata.json \
            --osm-country-geojson output/osm-country/colombia-relation-120027.json \
            --bbox -75.57 10.35 -75.45 10.51 \
            --minzoom 11 --maxzoom 13 --max-tiles 200 \
            --coast-render-only-sea-surface \
            --cache output/native-cog-cache \
            --output output/cartagena-render/cartagena-visual-terrain-rgb.mbtiles
      - name: Validate native source pixels, exact sea/mask, SQLite and extract mixed preview
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import io,json,sqlite3
          from pathlib import Path
          import numpy as np
          from render_only_coast_rgb import COAST_MODE,decode_mask_png,decode_terrain_rgb
          path=Path("output/cartagena-render/cartagena-visual-terrain-rgb.mbtiles")
          report=json.loads(path.with_suffix(".report.json").read_text())
          assert report["coast_render_mode"]==COAST_MODE
          assert report["mixed_coast_tiles_written"]>0
          assert report["no_synthetic_land_heights"] is True
          assert report["national_Terrain_RGB_release_authorized"] is False
          assert path.stat().st_size<300*1024*1024
          mixed_found=False
          land_total=sea_total=0
          with sqlite3.connect(path) as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              n=db.execute("SELECT COUNT(*) FROM tiles").fetchone()[0]
              masks=db.execute("SELECT COUNT(*) FROM osm_land_mask").fetchone()[0]
              assert n==masks==report["OSM_land_masks_written"]
              metadata=dict(db.execute("SELECT name,value FROM metadata"))
              assert metadata["coast_render_mode"]==COAST_MODE
              assert metadata["sea_surface_is_bathymetry"]=="false"
              for z,x,y,png,mask_png in db.execute(
                  "SELECT t.zoom_level,t.tile_column,t.tile_row,t.tile_data,m.mask_png "
                  "FROM tiles t JOIN osm_land_mask m USING(zoom_level,tile_column,tile_row)"):
                  land=decode_mask_png(mask_png)
                  heights=decode_terrain_rgb(png)
                  assert np.all(heights[~land]==0.0), (z,x,y)
                  assert np.all(np.isfinite(heights[land])),(z,x,y)
                  assert np.min(heights)>-10000.0,(z,x,y)
                  land_total+=int(land.sum())
                  sea_total+=int((~land).sum())
                  if land.any() and (~land).any() and not mixed_found:
                      (path.parent/"mixed-terrain-rgb.png").write_bytes(png)
                      (path.parent/"mixed-osm-land-mask.png").write_bytes(mask_png)
                      mixed_found=True
          assert mixed_found
          assert sea_total==report["render_only_OSM_sea_surface_pixels"]
          assert land_total==report["original_source_intersected_tile_valid_pixels"]
          print("SUCCESS: real coastal terrain tiles:",n,"land pixels:",land_total,
                "visual-only sea pixels:",sea_total,
                "max land RGB error:",report["max_Terrain_RGB_roundtrip_elevation_error_m"])
          PY
      - name: Save bounded real pilot and OSM evidence (7 days max)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: colombia-cartagena-real-osm-coast-visual-only-pilot
          path: |
            output/cartagena-render/*.mbtiles
            output/cartagena-render/*.json
            output/cartagena-render/mixed-*.png
          retention-days: 7
          if-no-files-found: error
