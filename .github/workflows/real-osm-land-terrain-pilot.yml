name: Real Colombia OSM Land-Only Terrain-RGB Pilot — Free Runner

on:
  workflow_dispatch:
    inputs:
      prepared_inputs_run_id:
        description: 'Reuse prepared OSM clip, OSM country and verified 140-COG CSV from a previous successful pilot run (0 = prepare once)'
        required: true
        type: string
        default: '0'

permissions:
  contents: read
  actions: read

concurrency:
  group: colombia-real-osm-terrain-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  genuine-inland-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing DEM and OSM dependencies
        run: python -m pip install -r requirements-terrain.txt -r requirements-island-inventory.txt
      - name: Recheck existing generator contract before using network or large data
        run: |
          python -m unittest discover -s tests -p 'test_generate_osm_land_only_terrain.py' -v
          python -m unittest discover -s tests -p 'test_osm_land_only_dem_policy.py' -v
      - name: Reuse prior complete staged 140-COG and OSM geometry bundle when available
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepared_inputs_run_id != '0' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ColombiaTransit/colombia-height
          run-id: ${{ inputs.prepared_inputs_run_id }}
          name: colombia-osm-terrain-pilot-inputs
          path: output
      - name: Reuse verified 140-COG staging list (never re-inventory the 137 sources)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.prepared_inputs_run_id == '0' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ColombiaTransit/colombia-height
          run-id: 43609451961
          name: colombia-tumaco-strict-source-staging-140
          path: output/stage140
      - name: Check free-runner disk budget before the sole OSM geometry preparation
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.prepared_inputs_run_id == '0' }}
        run: |
          python - <<'PY'
          import shutil
          free = shutil.disk_usage(".").free
          print("Available disk GiB before original OSM land polygon preparation:", round(free / 1024**3, 2))
          if free < 8 * 1024**3:
              raise RuntimeError("Less than 8 GiB free: do not risk OSM archive extraction on a standard free runner")
          PY
          df -h .
      - name: Rebuild only the missing original OSMCoastline clipped geometry once (not DEM source research)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.prepared_inputs_run_id == '0' }}
        run: |
          python scripts/osm_land_reference.py --output output/osm-reference
          df -h .
      - name: Save genuine OSM Colombia R120027 boundary as a reusable input
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.prepared_inputs_run_id == '0' }}
        run: python scripts/prepare_osm_colombia_relation.py --output output/osm-country/colombia-relation-120027.json
      - name: Validate inputs, clip hash, staging precedence and inland geometry
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from generate_osm_land_only_terrain import (
              require_verified_staging, load_osm_country, load_osm_coastline_land,
              plan_bounded_tiles, prepare_plan)
          from national_tile_plan import parse_manifest
          manifest = Path("output/stage140/colombia_dem_manifest_tumaco_staging_140.csv")
          sources = parse_manifest(manifest)
          require_verified_staging(sources)
          osm, meta = load_osm_coastline_land(
              Path("output/osm-reference/osm-land-study.wkb.gz"),
              Path("output/osm-reference/osm-land-study-metadata.json"))
          col = load_osm_country("output/osm-country/colombia-relation-120027.json")
          tiles = plan_bounded_tiles((-75.65, 6.23, -75.57, 6.31), 11, 13, 100)
          status, rows = prepare_plan(tiles, osm, col)
          print("Pilot source count:", len(sources), "pilot tile masks:", dict(status))
          assert status["fully_OSM_Colombia_land"] > 0
          assert not status["mixed_coastal_OSM_Colombia_land_and_offland"], (
              "Chosen inland bounding box contains mixed OSM physical-land pixels; fail closed")
          assert not status["skip_no_physical_OSM_Colombia_land"], (
              "Unexpected offland in selected interior pilot; inspect geometry")
          print("Verified genuine OSM clip SHA, Colombia relation, and 140 original URLs; no re-inventory.")
          PY
      - name: Persist a reusable 90-day OSM/140-source input bundle BEFORE native downloads
        uses: actions/upload-artifact@v4
        with:
          name: colombia-osm-terrain-pilot-inputs
          path: output/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
      - name: Produce real native Copernicus GLO-30 terrain in a small fully inland bbox
        run: |
          python scripts/generate_osm_land_only_terrain.py \
            --source-manifest output/stage140/colombia_dem_manifest_tumaco_staging_140.csv \
            --osm-land-clip output/osm-reference/osm-land-study.wkb.gz \
            --osm-land-meta output/osm-reference/osm-land-study-metadata.json \
            --osm-country-geojson output/osm-country/colombia-relation-120027.json \
            --bbox -75.65 6.23 -75.57 6.31 \
            --minzoom 11 --maxzoom 13 \
            --max-tiles 100 \
            --cache output/native-cog-cache \
            --output output/pilot/colombia-inland-real-terrain-rgb.mbtiles
      - name: Verify real PNGs, TMS/SQLite integrity, source provenance and hard file cap
        run: |
          python - <<'PY'
          import io, json, sqlite3
          from pathlib import Path
          from PIL import Image
          path = Path("output/pilot/colombia-inland-real-terrain-rgb.mbtiles")
          report = json.loads(path.with_suffix(".report.json").read_text())
          assert path.stat().st_size < 512 * 1024**2, "Bounded pilot exceeded 512 MiB output cap"
          assert report["full_land_tiles_written"] > 0
          assert report["mask_summary"].get("mixed_coastal_OSM_Colombia_land_and_offland", 0) == 0
          assert report["no_ocean_RGB_pixel_generated"]
          assert report["no_synthetic_elevations"]
          assert report["max_Terrain_RGB_roundtrip_elevation_error_m"] <= 0.051
          assert report["staging_COG_count"] == 140
          with sqlite3.connect(path) as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              n = db.execute("SELECT count(*) FROM tiles").fetchone()[0]
              assert n == report["full_land_tiles_written"]
              for (blob,) in db.execute("SELECT tile_data FROM tiles"):
                  with Image.open(io.BytesIO(blob)) as im:
                      assert im.format == "PNG" and im.size == (256, 256)
                      assert im.mode == "RGB"
          print("SUCCESS: REAL native GLO-30 interior PNG Terrain-RGB MBTiles;", n, "tiles;", path.stat().st_size, "bytes")
          print("NO shore/ocean DEM product and NO national release authorized.")
          PY
          df -h .
      - name: Upload only genuine compact pilot product and validation report, never raw source COGs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: colombia-real-osm-land-only-terrain-pilot
          path: |
            output/pilot/colombia-inland-real-terrain-rgb.mbtiles
            output/pilot/colombia-inland-real-terrain-rgb.report.json
          retention-days: 7
          if-no-files-found: error
