name: Two Copernicus COG Seam and Batch Validation

on:
  workflow_dispatch:
    inputs:
      maxzoom:
        description: 'Highest test zoom (start with 13)'
        required: true
        type: choice
        options: ['13', '12']
        default: '13'

permissions:
  contents: read

jobs:
  two-cog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install terrain dependencies
        run: python -m pip install -r requirements-terrain.txt -r requirements-island-inventory.txt
      - name: Full regression test suite, including synthetic adjacent source COGs
        run: python -m unittest discover -s tests -v
      - name: Disk available before
        run: df -h .
      - name: Render separate batches directly from adjacent source COGs
        run: python scripts/two_cog_seam_pilot.py --output output/two-cog-seams --maxzoom ${{ inputs.maxzoom }}
      - name: Verify summary and strict source-border evidence
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path
          root=Path("output/two-cog-seams")
          report=json.loads((root/"two-cog-seam-report.json").read_text())
          qa=report["qa"]
          expected=sum(sum(b["tile_counts"].values()) for b in report["batches"])
          assert report["merged"]["tiles"]==expected
          assert qa["within_acceptance"]
          assert qa["max_reference_error_m"]<=0.16
          assert qa["vertical_cross_batch_pairs"]>=6
          assert len(qa["reference_cogs"])>=2
          assert qa["cross_source_adjacent_pixel_pairs"]>0
          with sqlite3.connect(root/"two-cog-merged.mbtiles") as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM tiles").fetchone()[0]==expected
          print("Merged unique Terrain-RGB tiles:",expected)
          print("Verified cross-batch seams:",qa["vertical_cross_batch_pairs"])
          print("Observed source-boundary pixel pairs:",qa["cross_source_adjacent_pixel_pairs"])
          print("Maximum reference error (m):",qa["max_reference_error_m"])
          print("Native source COGs:",qa["reference_cogs"])
          PY
      - name: Disk available after
        if: always()
        run: df -h .
      - name: Upload compact result only; no COGs or MBTiles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: colombia-two-cog-seam-validation
          path: output/two-cog-seams/two-cog-seam-report.json
          retention-days: 1
          if-no-files-found: error
