name: Verify Final Offshore Tumaco Tile — OSM Ocean Render Control Only

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-final-tumaco-osm-tile.yml'
      - 'scripts/verify_last_tumaco_osm_render_tile.py'
      - 'tests/test_verify_last_tumaco_osm_render_tile.py'

permissions:
  contents: read
  actions: read

jobs:
  exact-offshore-osm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install only image decoding and raster mask QA
        run: python -m pip install numpy pillow requests
      - name: Test strict negative-control safety
        run: python -m unittest discover -s tests -p 'test_verify_last_tumaco_osm_render_tile.py' -v
      - name: Reuse exact previous 27+68 OSM study instead of fetching coastlines
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ColombiaTransit/colombia-height
          run-id: 43611992754
          name: colombia-osm-only-final-land-scope-without-native-reruns
          path: output/previous-osm
      - name: Verify only z13 2297 4050 and one open water control via OSM Standard tiles
        run: |
          python scripts/verify_last_tumaco_osm_render_tile.py \
            --original-osm output/previous-osm/osm-colombia-land-scope.json \
            --output output/tumaco-last-offshore-tile/osm-render-ocean-reference.json
      - name: Refuse false confidence in raster styling or sea depths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/tumaco-last-offshore-tile/osm-render-ocean-reference.json')
          r=json.loads(p.read_text())
          assert r['target_tile_zxy']==[13,2297,4050]
          assert r['ocean_control_tile_zxy']==[13,2290,4050]
          assert r['source_native_140_missing_DEM_pixel_centers']==31232
          assert r['OSM_standard_target_pixels_matching_offshore_reference_colour']==65536
          assert r['OSM_standard_target_pixels_not_matching_offshore_reference_colour']==0
          assert r['local_OSM_natural_coastline_way_intersections']==0
          assert r['local_OSM_closed_CCW_land_island_polygon_intersections']==0
          assert r['local_OSM_named_island_area_intersections']==0
          assert r['OSM_standard_render_is_not_certified_vector_pixel_land_mask'] is True
          assert r['render_level_offshore_exception_resolved'] is True
          assert r['native_DEM_values_recomputed']==0
          assert r['global_OSM_coastline_archive_downloaded'] is False
          assert r['the_tile_does_not_authorize_national_publication'] is True
          print('Final target offshore tile is entirely OSM-standard ocean fill at the rendered z13 resolution.')
          print('No new original native DEM samples, no bathymetry; generator must use exact OSM polygons for final mask.')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: colombia-final-one-offshore-tumaco-osm-render-negative-control
          path: output/tumaco-last-offshore-tile/osm-render-ocean-reference.json
          retention-days: 1
          if-no-files-found: error
