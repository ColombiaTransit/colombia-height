<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColombiaTransit — actual Cartagena coastal RGB / OSM land QA</title>
<link href="/maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{background:#e1e8e8;font:13px sans-serif}
#legend{position:absolute;top:12px;left:12px;background:#ffffffec;padding:14px;z-index:3;border-radius:8px;max-width:340px;box-shadow:0 2px 12px #0003}
#legend b{display:block;margin-bottom:7px}
#status{font-size:11px;color:#555;margin-top:7px}
</style>
</head>
<body>
<div id="map"></div>
<div id="legend"><b>Cartagena — actual Copernicus terrain</b>OSM land: original GLO-30 height. OSM sea: 0 m <em>visual-only surface</em>; NOT bathymetry.<div id="status">Loading MapLibre DEM source…</div></div>
<script type="module">
import * as maplibregl from "/maplibre-gl.mjs";
window.maplibregl=maplibregl;
window.__mapErrors=[];
window.__terrainReady=false;
window.__loadedDemTiles=0;
const requestedTiles=new URLSearchParams(window.location.search).get('tiles');
const tileTemplate=requestedTiles || 'http://127.0.0.1:8765/tiles/{z}/{x}/{y}.png';
const source = {
 type:'raster-dem',
 tiles:[tileTemplate],
 minzoom:11,maxzoom:13,tileSize:256,encoding:'mapbox',
 attribution:'Contains modified Copernicus DEM; © OpenStreetMap contributors'
};
const map=new maplibregl.Map({
 container:'map',
 center:[-75.511,10.424],zoom:12.8,pitch:58,bearing:-8,
 attributionControl:true,
 style:{version:8,
   sources:{'colombia-dem':source},
   layers:[
     {id:'background',type:'background',paint:{'background-color':'#afcedb'}},
     {id:'terrain-shading',type:'hillshade',source:'colombia-dem',
      paint:{'hillshade-exaggeration':0.65}}
   ]}
});
window.__map=map;
map.on('error', e=>{window.__mapErrors.push(String(e.error?.message||e.error||e));document.getElementById('status').textContent='MapLibre warning: '+window.__mapErrors.slice(-1)[0];});
map.on('load', ()=>{
 map.setTerrain({source:'colombia-dem',exaggeration:1});
 document.getElementById('status').textContent='MapLibre terrain enabled; awaiting real tiles…';
});
map.on('sourcedata',e=>{
 if(e.sourceId==='colombia-dem' && e.isSourceLoaded){
   window.__terrainReady=true;
   document.getElementById('status').textContent='MapLibre raster-dem loaded. No bathymetry encoded.';
 }
});
</script>
</body>
</html>
