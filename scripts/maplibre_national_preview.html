<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColombiaTransit — genuine NATIONAL Copernicus/OSM Terrain-RGB QA</title>
<link href="/maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{font:13px system-ui;background:#dce9ef}
#legend{position:absolute;top:16px;left:16px;background:#fffffff2;color:#182834;padding:14px;z-index:3;border-radius:8px;max-width:380px;box-shadow:0 2px 10px #1113}
#status{font-size:11px;color:#4b5563;margin-top:8px}
</style>
</head>
<body>
<div id="map"></div>
<div id="legend">
<strong>ColombiaTransit — national terrain audit (0–13)</strong>
<div>Original Copernicus heights inside Colombian OSM land. Sea and outside-country physical land: <em>visual-only 0 m</em>, not measured height or bathymetry.</div>
<div id="status">Loading actual TileServer GL raster DEM…</div>
</div>
<script type="module">
import * as maplibregl from '/maplibre-gl.mjs';
window.maplibregl=maplibregl;
window.__mapErrors=[];
window.__terrainReady=false;
const q=new URLSearchParams(window.location.search);
const lon=Number(q.get('lon')||'-74.0721');
const lat=Number(q.get('lat')||'4.711');
const zoom=Number(q.get('zoom')||'11.5');
const tiles=q.get('tiles')||'http://127.0.0.1:8080/data/colombia-terrain/{z}/{x}/{y}.png';
const source={
  type:'raster-dem',tiles:[tiles],tileSize:256,minzoom:0,maxzoom:13,encoding:'mapbox',
  attribution:'Contains modified Copernicus DEM data; © OpenStreetMap contributors (ODbL 1.0)'
};
const map=new maplibregl.Map({
 container:'map', center:[lon,lat],zoom,pitch:65,bearing:-23,
 attributionControl:true,
 style:{version:8,
  sources:{'colombia-terrain':source},
  layers:[
    {id:'background',type:'background',paint:{'background-color':'#c4d8e1'}},
    {id:'hillshade',type:'hillshade',source:'colombia-terrain',
     paint:{'hillshade-exaggeration':0.75,'hillshade-shadow-color':'#363b41','hillshade-highlight-color':'#fcfcfa'}}
  ]}
});
window.__map=map;
window.__center=[lon,lat];
map.on('error', e=>{
 window.__mapErrors.push(String(e.error?.message||e.error||e));
 document.getElementById('status').textContent='MapLibre error: '+window.__mapErrors.slice(-1)[0];
});
map.on('load',()=>{
 map.setTerrain({source:'colombia-terrain',exaggeration:1});
 document.getElementById('status').textContent='3D enabled; waiting for REAL national TileServer GL PNGs';
});
map.on('sourcedata',e=>{
 if(e.sourceId==='colombia-terrain' && e.isSourceLoaded){
  window.__terrainReady=true;
  document.getElementById('status').textContent='Real national terrain loaded; out-of-scope background is not factual elevation.';
 }
});
</script>
</body>
</html>
